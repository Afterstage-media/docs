services:
  social-manager:
    build:
      context: ./social-manager
      dockerfile: Dockerfile
    env_file:
      - path: ./social-manager/.env
        required: false
    environment:
      PORT: 8787
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      MEDIA_ROOT: /app/media
      MONGODB_DB: ${MONGODB_DB:-medio_under}
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - social_manager_data:/app/data
      - social_manager_uploads:/app/uploads
      - social_manager_media:/app/media
    restart: unless-stopped

  website:
    build:
      context: .
      dockerfile: infra/Dockerfile
    depends_on:
      social-manager:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  cloudflared-quick:
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["quick-tunnel"]
    depends_on:
      website:
        condition: service_started
    command: tunnel --no-autoupdate --url http://website:80
    restart: unless-stopped

  cloudflared-named:
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["named-tunnel"]
    depends_on:
      website:
        condition: service_started
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped

volumes:
  social_manager_data:
  social_manager_uploads:
  social_manager_media:
